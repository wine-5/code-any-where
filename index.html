<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1419">
<title>VoiceIDE プロトタイプ</title>
<style>
:root{
  --bg:#0f1419; --panel:#161c24; --panel2:#1d2530; --line:#2a3441;
  --text:#e6edf3; --muted:#8b98a8; --accent:#3ddc97; --accent2:#4aa3ff;
  --warn:#ffb454; --err:#ff6b6b; --kw:#c792ea; --num:#f78c6c; --str:#c3e88d; --cmt:#637777;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;overscroll-behavior:none}
.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:1fr;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;letter-spacing:.02em}
.badge{font-size:11px;color:var(--warn);border:1px solid var(--warn);border-radius:99px;padding:1px 8px}
.sp{flex:1}
.state{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--panel2);padding:4px 10px;border-radius:99px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.state[data-s=Listening] .dot{background:var(--err);animation:pulse 1s infinite}
.state[data-s=Interpreting] .dot{background:var(--accent2)}
.state[data-s=Applying] .dot{background:var(--warn)}
.state[data-s=Speaking] .dot{background:var(--accent)}
@keyframes pulse{50%{opacity:.3}}
.toggle{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 8px;font-size:12px}
.toggle[aria-pressed=true]{color:var(--accent);border-color:var(--accent)}

main{min-height:0;display:grid;grid-template-rows:minmax(0,1.2fr) minmax(0,1fr);gap:0}
.editor{min-height:0;display:flex;flex-direction:column;border-bottom:1px solid var(--line)}
.tabs{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.file{font:600 12px ui-monospace,Menlo,monospace;color:var(--accent2);padding:3px 8px;background:var(--panel2);border-radius:6px}
.meta{font-size:11px;color:var(--muted)}
.mini{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:5px 10px;font-size:13px}
.mini:active{background:var(--line)}
.code{flex:1;min-height:0;overflow:auto;padding:8px 0;font:14px/1.65 ui-monospace,"SF Mono",Menlo,Consolas,monospace;-webkit-overflow-scrolling:touch}
.row{display:flex;white-space:pre;padding-right:14px}
.ln{flex:none;width:44px;text-align:right;padding-right:12px;color:#4a5767;user-select:none}
.row.caret{background:rgba(61,220,151,.1);outline:1px dashed rgba(61,220,151,.5);outline-offset:-1px}
.row.caret .ln{color:var(--accent)}
.caret i{display:inline-block;width:2px;height:1.2em;background:var(--accent);vertical-align:middle;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hint{color:var(--muted);font-size:12px;margin-left:10px;font-family:-apple-system,sans-serif}
.k{color:var(--kw)}.n{color:var(--num)}.s{color:var(--str)}.c{color:var(--cmt)}.p{color:#ffcb6b}

.side{min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.tr{padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.tr .lab{font-size:11px;color:var(--muted);display:flex;gap:8px;align-items:center}
.tag{border-radius:4px;padding:0 6px;font-size:10px;font-weight:700}
.tag.prov{background:#3a2f12;color:var(--warn)}.tag.fin{background:#103a2a;color:var(--accent)}
.tr .txt{font-size:18px;min-height:28px;word-break:break-all}
.tr .txt.prov{color:var(--warn);opacity:.9}
.clar{display:none;margin:10px 14px 0;padding:10px 12px;border:1px solid var(--warn);border-radius:10px;background:#2a2314}
.clar.on{display:block}
.clar b{display:block;margin-bottom:8px;color:var(--warn)}
.clar button{margin:0 6px 6px 0;background:var(--warn);color:#201500;border:0;border-radius:8px;padding:7px 12px;font-weight:700;font-size:14px}
.stabs{display:flex;gap:4px;padding:8px 14px 0}
.stab{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:6px 10px;font-size:13px}
.stab[aria-selected=true]{color:var(--text);border-color:var(--accent)}
.pane{display:none;flex:1;min-height:0;overflow:auto;padding:10px 14px;-webkit-overflow-scrolling:touch}
.pane.on{display:block}
pre.out{margin:0;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.ok{color:var(--accent)}.er{color:var(--err)}.mu{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:99px;padding:7px 12px;font-size:13px}
.chip:active{border-color:var(--accent)}
.grp{font-size:11px;color:var(--muted);margin:12px 0 6px}.grp:first-child{margin-top:0}
.demo{display:inline-block;margin-bottom:10px;background:var(--accent);color:#04251a;border:0;border-radius:10px;padding:9px 14px;font-weight:700}

.dock{display:flex;align-items:center;gap:10px;padding:10px 12px calc(10px + 2px);background:var(--panel);border-top:1px solid var(--line)}
.dock form{flex:1;display:flex;gap:8px;min-width:0}
.dock input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;font-size:16px}
.dock input:focus{outline:none;border-color:var(--accent2)}
.send{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:0 14px;font-size:14px}
.mic{flex:none;width:68px;height:68px;border-radius:50%;border:0;background:var(--accent);color:#04251a;font-size:28px;box-shadow:0 4px 16px rgba(61,220,151,.35)}
.mic.on{background:var(--err);color:#fff;animation:pulse 1.2s infinite;box-shadow:0 0 0 8px rgba(255,107,107,.2)}
.run{flex:none;display:flex;flex-direction:column;gap:6px}
.run button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}

/* iPad横 / PC */
@media (min-width:900px){
  main{grid-template-rows:1fr;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
  .editor{border-bottom:0;border-right:1px solid var(--line)}
  .code{font-size:16px}
  .tr .txt{font-size:22px}
}
@media (max-height:520px) and (orientation:landscape){
  main{grid-template-rows:1fr;grid-template-columns:1.2fr 1fr}
  .editor{border-bottom:0;border-right:1px solid var(--line)}
  .mic{width:52px;height:52px;font-size:22px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🎙 VoiceIDE</h1><span class="badge">プロトタイプ</span>
    <span class="sp"></span>
    <button class="toggle" id="ttsBtn" aria-pressed="true">🔊 読み上げ</button>
    <div class="state" id="state" data-s="Idle"><span class="dot"></span><span id="stateTxt">待機中</span></div>
  </header>

  <main>
    <section class="editor">
      <div class="tabs">
        <span class="file">main.cpp</span><span class="meta" id="ver">v0 · C++17</span>
        <span class="sp"></span>
        <button class="mini" id="bUndo">↶</button><button class="mini" id="bRedo">↷</button>
      </div>
      <div class="code" id="code" aria-label="コード"></div>
    </section>

    <section class="side">
      <div class="tr">
        <div class="lab"><span class="tag prov" id="tag">暫定</span><span id="trLab">発話するとここに文字起こしが出ます</span></div>
        <div class="txt prov" id="tr">&nbsp;</div>
      </div>
      <div class="clar" id="clar"><b id="clarQ"></b><div id="clarOpts"></div></div>
      <div class="stabs" role="tablist">
        <button class="stab" role="tab" aria-selected="true" data-p="pOut">出力</button>
        <button class="stab" role="tab" aria-selected="false" data-p="pCmd">コマンド例</button>
        <button class="stab" role="tab" aria-selected="false" data-p="pJson">編集JSON</button>
      </div>
      <div class="pane on" id="pOut"><pre class="out" id="out"><span class="mu">「ビルドして実行」で結果がここに出ます。
（試作ではブラウザ内の模擬実行です）</span></pre></div>
      <div class="pane" id="pCmd">
        <button class="demo" id="demo">▶ デモシナリオを自動再生（合計 → 55）</button>
        <div id="cmdList"></div>
      </div>
      <div class="pane" id="pJson"><pre class="out" id="json"><span class="mu">コードを編集すると、AIが返す想定の編集コマンド(JSON)がここに出ます。</span></pre></div>
    </section>
  </main>

  <div class="dock">
    <button class="mic" id="mic" aria-label="音声入力">🎤</button>
    <form id="form" autocomplete="off">
      <input id="inp" placeholder="音声が使えない時は文字で（例: イント カウント ゼロ）" enterkeyhint="send">
      <button class="send" type="submit">送信</button>
    </form>
    <div class="run"><button id="bBuild">ビルド</button><button id="bRun">実行</button></div>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);

/* ---------- 文字ユーティリティ ---------- */
const toKata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
const toHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const R = src => new RegExp(toHira(src));
const norm = s => toHira(s.normalize('NFKC')).replace(/[、。,.！!？?\s]/g, '');
const NAMES = {カウント:'count',サム:'sum',エー:'a',ビー:'b',アイ:'i',ジェイ:'j',エックス:'x',スコア:'score',スピード:'speed',フラグ:'flag',イズアクティブ:'isActive'};
const NAME_MAP = Object.fromEntries(Object.entries(NAMES).map(([k, v]) => [toHira(k), v]));

/* ---------- ドキュメント ---------- */
const INIT = ['#include <iostream>', '', 'int main() {', '}'];
let doc = { lines: INIT.slice(), cursor: 3, version: 0 };
let undoStack = [], redoStack = [], lastJson = null;
const snap = () => ({ lines: doc.lines.slice(), cursor: doc.cursor });
const restore = s => { doc.lines = s.lines.slice(); doc.cursor = s.cursor; doc.version++; };
const lead = l => l.match(/^ */)[0].length;
function curIndent() {
  const prev = doc.lines[doc.cursor - 1];
  if (prev === undefined) return 0;
  return lead(prev) + (prev.trim().endsWith('{') ? 4 : 0);
}
function commit(newLines, caretIdx, fb, type = 'insert_code') {
  const pos = { line: doc.cursor + 1, column: 1 };
  undoStack.push(snap()); redoStack = [];
  const ind = ' '.repeat(curIndent());
  const ins = newLines.map(l => ind + l);
  doc.lines.splice(doc.cursor, 0, ...ins);
  doc.cursor += caretIdx ?? ins.length;
  doc.version++;
  lastJson = { schemaVersion: 1, documentVersion: doc.version - 1, operation: { type, position: pos, code: newLines.join('\n') }, spokenFeedback: fb };
  return fb;
}

/* ---------- 解釈（定型コマンド → 擬似LLM） ---------- */
const ident = s => /^[A-Za-z_]\w*$/.test(s) ? s : NAME_MAP[toHira(s)] || null;
const exists = n => doc.lines.some(l => new RegExp('\\b' + n + '\\b').test(l));
const operand = s => /^\d+(\.\d+)?$/.test(s) ? s : s === 'ぜろ' ? '0' : ident(s);
const num = s => s === 'ぜろ' ? '0' : /^\d+$/.test(s) ? s : null;
const CMP = { 以上: '>=', 以下: '<=', 未満: '<', より大きい: '>', より小さい: '<', と等しい: '==' };
const unknown = n => ({ clarify: `「${toKata(n)}」はまだ宣言されていません。どの変数ですか？` });

function interpret(raw) {
  const typed = raw.normalize('NFKC').trim().match(/^(int|float|bool)\s+(\w+)\s+(\S+)$/i);
  if (typed) return decl(typed[1].toLowerCase(), typed[2], typed[3]);
  const t = norm(raw); let m;
  if (R('^(一つ|ひとつ)?(戻して|もどして|取り消して)$').test(t)) return { op: 'undo' };
  if (R('^やり直して$').test(t)) return { op: 'redo' };
  if (R('^直前の行を削除(して)?$').test(t)) return { op: 'delete' };
  if (R('^(ブロック|括弧)?(を)?(抜けて|出て)$').test(t)) return { op: 'exit' };
  if (R('^ビルドして実行$').test(t)) return { op: 'build_and_run' };
  if (R('^ビルド(して)?$').test(t)) return { op: 'build' };
  if (R('^実行(して)?$').test(t)) return { op: 'run' };
  if (R('^保存して$').test(t)) return { op: 'save' };
  if (R('^エラーを説明して$').test(t)) return { op: 'explain' };
  if (R('^(今の行|コード)を読み上げて$').test(t)) return { op: 'read' };
  if (m = t.match(R('^(イント|フロート|ブール)(.+?)(ぜろ|\\d+(?:\\.\\d+)?|とぅるー|ふぉるす|真|偽)$')))
    return decl({ いんと: 'int', ふろーと: 'float', ぶーる: 'bool' }[m[1]], m[2], m[3]);
  if (m = t.match(R('^(?:ふぉー文)?(.+?)[をが](\\S+?)から(\\S+?)(未満|以下)?まで(?:ループ|1ずつ増やして)?$'))) {
    const v = ident(m[1]), a = num(m[2]), b = num(m[3]);
    if (!v || a === null || b === null) return { clarify: '変数名と範囲をもう一度教えてください。' };
    if (!m[4]) return { clarify: `${b}未満ですか？ ${b}以下ですか？`, opts: [[`${b}未満`, `${toKata(m[1])}を${a}から${b}未満までループ`], [`${b}以下`, `${toKata(m[1])}を${a}から${b}以下までループ`]] };
    return { op: 'block', head: `for (int ${v} = ${a}; ${v} ${CMP[m[4]]} ${b}; ++${v}) {`, fb: `${v}を${a}から${b}${m[4]}までのforループを作ります` };
  }
  if (m = t.match(R('^(\\d+)まで(ループ|繰り返して)$')))
    return { clarify: `${m[1]}未満ですか？ ${m[1]}以下ですか？（変数はiで0から数えます）`, opts: [[`${m[1]}未満`, `アイを0から${m[1]}未満までループ`], [`${m[1]}以下`, `アイを0から${m[1]}以下までループ`]] };
  if (m = t.match(R('^(.+?)が(\\S+?)(以上|以下|未満|より大きい|より小さい|と等しい)なら$'))) {
    const v = ident(m[1]), b = operand(m[2]);
    if (!v || !exists(v)) return unknown(m[1]);
    if (!b) return { clarify: '比較する値が聞き取れませんでした。' };
    return { op: 'block', head: `if (${v} ${CMP[m[3]]} ${b}) {`, fb: `${v}が${m[2]}${m[3]}のif文を作ります` };
  }
  if (m = t.match(R('^(.+?)が(真|しん)の間$'))) {
    const v = ident(m[1]); if (!v || !exists(v)) return unknown(m[1]);
    return { op: 'block', head: `while (${v}) {`, fb: `${v}が真の間のwhileを作ります` };
  }
  if (R('^それ以外なら$').test(t)) {
    if (doc.lines[doc.cursor - 1]?.trim() !== '}') return { clarify: '直前にifブロックがありません。対応するifはどれですか？' };
    return { op: 'block', head: 'else {', fb: 'elseブロックを作ります' };
  }
  if (m = t.match(R('^(.+?)に(.+?)を足して$'))) {
    const v = ident(m[1]), x = operand(m[2]);
    if (!v || !exists(v)) return unknown(m[1]);
    if (!x) return { clarify: '足す値が分かりませんでした。' };
    return { op: 'stmt', code: `${v} += ${x};`, fb: `${v}に${x}を足します` };
  }
  if (m = t.match(R('^(.+?)を(\\d+)?増やして$'))) {
    const v = ident(m[1]), n = m[2] || '1';
    if (!v || !exists(v)) return unknown(m[1]);
    return { op: 'stmt', code: n === '1' ? `++${v};` : `${v} += ${n};`, fb: `${v}を${n}増やします` };
  }
  if (m = t.match(R('^(.+?)を(表示|出力)して$'))) {
    const v = operand(m[1]);
    if (!v || (!/^\d/.test(v) && !exists(v))) return unknown(m[1]);
    return { op: 'stmt', code: `std::cout << ${v} << std::endl;`, fb: `${v}を表示する行を追加します` };
  }
  if (m = t.match(R('^(.+?)を返して$'))) {
    const v = operand(m[1]); if (!v) return { clarify: '返す値が分かりませんでした。' };
    return { op: 'stmt', code: `return ${v};`, fb: `${v}を返します` };
  }
  return { op: 'unsupported' };
}
function decl(type, name, val) {
  const v = ident(name); if (!v) return { clarify: `変数名「${name}」が分かりません。英字で言い直すか、文字で入力してください。` };
  const w = toHira(val);
  let lit = w === 'ぜろ' ? '0' : w === 'とぅるー' || w === '真' || w === 'true' ? 'true' : w === 'ふぉるす' || w === '偽' || w === 'false' ? 'false' : val;
  if (type === 'float') { lit = (lit === '0' ? '0.0' : lit) + 'f'; if (!/\./.test(lit)) lit = lit.replace('f', '.0f'); }
  if (type === 'bool' && lit !== 'true' && lit !== 'false') lit = lit === '0' ? 'false' : 'true';
  return { op: 'stmt', code: `${type} ${v} = ${lit};`, fb: `${type}型の${v}を追加します` };
}

/* ---------- 適用 ---------- */
function apply(c) {
  switch (c.op) {
    case 'stmt': return commit([c.code], 1, c.fb);
    case 'block': return commit([c.head, '}'], 1, c.fb);
    case 'undo': if (!undoStack.length) return '戻す操作がありません'; redoStack.push(snap()); restore(undoStack.pop()); return '一つ戻しました';
    case 'redo': if (!redoStack.length) return 'やり直す操作がありません'; undoStack.push(snap()); restore(redoStack.pop()); return 'やり直しました';
    case 'delete': {
      const c0 = doc.cursor, prev = doc.lines[c0 - 1];
      if (prev === undefined || !prev.trim() || prev.trim().endsWith('{') || /^(#include|int main)/.test(prev.trim())) return 'この行は削除できません';
      let from = c0 - 1;
      if (prev.trim() === '}') { while (from >= 0 && !(lead(doc.lines[from]) === lead(prev) && doc.lines[from].trim().endsWith('{'))) from--; if (from < 0) return '削除範囲を特定できません'; }
      if (from === 2) return 'main関数は削除できません';
      undoStack.push(snap()); redoStack = [];
      lastJson = { schemaVersion: 1, documentVersion: doc.version, operation: { type: 'delete_range', start: { line: from + 1, column: 1 }, end: { line: c0, column: 1 }, code: '' }, spokenFeedback: '直前の行を削除します' };
      doc.lines.splice(from, c0 - from); doc.cursor = from; doc.version++;
      return '直前の行を削除しました';
    }
    case 'exit': {
      const ind = curIndent();
      for (let j = doc.cursor; j < doc.lines.length; j++) if (doc.lines[j].trim() === '}' && lead(doc.lines[j]) < ind && lead(doc.lines[j]) > 0) { doc.cursor = j + 1; return 'ブロックを抜けました'; }
      return 'これ以上外へは出られません';
    }
    case 'save': try { localStorage.setItem('voiceide', JSON.stringify(doc.lines)); return '保存しました'; } catch { return '保存できませんでした'; }
    case 'read': return '現在の行は ' + (doc.lines[doc.cursor - 1] || '空行').trim().replace(/[{};]/g, ' ');
    default: return null;
  }
}

/* ---------- 模擬ビルド / 実行（C++ → JS 簡易変換） ---------- */
let lastErr = null, built = false;
function compile() {
  const L = doc.lines; let depth = 0;
  for (let i = 0; i < L.length; i++) {
    const t = L[i].trim(); if (!t || t.startsWith('#')) continue;
    for (const ch of t) { if (ch === '{') depth++; if (ch === '}') depth--; }
    if (depth < 0) return { ok: false, err: `${i + 1}行目: 余分な } があります` };
    if (!/[;{}]$/.test(t) && !/^(else)$/.test(t)) return { ok: false, err: `${i + 1}行目: ';' がありません → ${t}` };
  }
  if (depth !== 0) return { ok: false, err: '波括弧 { } の数が合っていません' };
  if (!L.some(l => /int main\s*\(/.test(l))) return { ok: false, err: 'main関数がありません' };
  return { ok: true };
}
function execute() {
  const L = doc.lines.filter(l => !l.trim().startsWith('#')); let js = 'let __G=0;\n';
  L.forEach((l, i) => {
    let s = l;
    if (/^\s*int main\s*\(/.test(s)) s = '(function main(){';
    else if (i === L.length - 1 && s.trim() === '}') s = '})();';
    s = s.replace(/^(\s*)for \(int /, '$1for (let ').replace(/^(\s*)(int|float|bool) (\w+) = ([^;]+);/, (_, a, __, n, v) => `${a}let ${n} = ${v.replace(/(\d)f$/, '$1')};`);
    const co = s.match(/^(\s*)std::cout\s*<<\s*(.*);$/);
    if (co) s = co[1] + '__o(' + co[2].split('<<').map(p => p.trim() === 'std::endl' ? '"\\n"' : p.trim()).join(',') + ');';
    s = s.replace(/^(\s*)(for|while)\b(.*)\{\s*$/, "$1$2$3{ if(++__G>1e6)throw new Error('実行時間超過(TLE)');");
    js += s + '\n';
  });
  let out = '';
  try { new Function('__o', js)((...a) => { out += a.join(''); }); }
  catch (e) {
    if (e instanceof ReferenceError) return { ok: false, err: '未宣言の識別子があります: ' + e.message };
    return { ok: false, err: e.message };
  }
  return { ok: true, out };
}

/* ---------- 表示 ---------- */
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
function hl(line) {
  return line.replace(/(#include.*$)|(\/\/.*$)|("(?:[^"\\]|\\.)*")|\b(int|float|bool|void|return|for|if|else|while|true|false)\b|\b(std)\b|(\b\d+(?:\.\d+)?f?\b)|([\s\S])/g,
    (m, inc, cm, st, kw, sd, nm, ch) => inc ? `<span class="p">${esc(inc)}</span>` : cm ? `<span class="c">${esc(cm)}</span>` : st ? `<span class="s">${esc(st)}</span>`
      : kw ? `<span class="k">${kw}</span>` : sd ? `<span class="n">std</span>` : nm ? `<span class="n">${nm}</span>` : esc(ch));
}
function render() {
  const el = $('code'); let h = '';
  const caretRow = `<div class="row caret" id="caretRow"><span class="ln">›</span>${' '.repeat(curIndent())}<i></i><span class="hint">次の音声入力位置</span></div>`;
  doc.lines.forEach((l, i) => {
    if (i === doc.cursor) h += caretRow;
    h += `<div class="row"><span class="ln">${i + 1}</span><span>${hl(l)}</span></div>`;
  });
  if (doc.cursor >= doc.lines.length) h += caretRow;
  el.innerHTML = h;
  $('caretRow')?.scrollIntoView({ block: 'nearest' });
  $('ver').textContent = `v${doc.version} · C++17`;
  $('bUndo').disabled = !undoStack.length; $('bRedo').disabled = !redoStack.length;
  $('json').textContent = lastJson ? JSON.stringify(lastJson, null, 2) : '(まだ編集がありません)';
}
const STATE_JA = { Idle: '待機中', Listening: '聞き取り中', Interpreting: '解釈中', Applying: '適用中', Speaking: '読み上げ中' };
function setState(s) { $('state').dataset.s = s; $('stateTxt').textContent = STATE_JA[s]; }
function setOut(html) { $('out').innerHTML = html; showPane('pOut'); }
function showPane(id) {
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === id));
  document.querySelectorAll('.stab').forEach(b => b.setAttribute('aria-selected', b.dataset.p === id));
}
function showTr(text, final) {
  $('tr').textContent = text || ' '; $('tr').classList.toggle('prov', !final);
  $('tag').textContent = final ? '確定' : '暫定'; $('tag').className = 'tag ' + (final ? 'fin' : 'prov');
  $('trLab').textContent = final ? '発話終了 → コマンド確定' : '聞き取り中（コードは変更しません）';
}

/* ---------- 音声出力 ---------- */
let ttsOn = true;
$('ttsBtn').onclick = () => { ttsOn = !ttsOn; $('ttsBtn').setAttribute('aria-pressed', ttsOn); if (!ttsOn) speechSynthesis?.cancel(); };
function speak(text) {
  return new Promise(res => {
    if (!ttsOn || !('speechSynthesis' in window)) return setTimeout(res, 350);
    const u = new SpeechSynthesisUtterance(text); u.lang = 'ja-JP';
    u.onend = u.onerror = () => res();
    speechSynthesis.cancel(); speechSynthesis.speak(u);
    setTimeout(res, 8000);
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---------- メインフロー ---------- */
let busy = false;
function showClarify(q, opts) {
  $('clarQ').textContent = '🤔 ' + q; $('clarOpts').innerHTML = '';
  (opts || []).forEach(([label, cmd]) => { const b = document.createElement('button'); b.textContent = label; b.onclick = () => { hideClarify(); handle(cmd); }; $('clarOpts').appendChild(b); });
  $('clar').classList.add('on');
}
const hideClarify = () => $('clar').classList.remove('on');

async function doBuild(run) {
  const verb = run ? 'ビルドして実行' : 'ビルド';
  setOut(`<span class="mu">${verb}中…</span>`); await wait(500);
  const c = compile();
  if (!c.ok) { lastErr = c.err; built = false; setOut(`<span class="er">✖ コンパイルエラー</span>\n${esc(c.err)}`); return 'ビルド失敗。' + c.err.replace(/→.*/, ''); }
  built = true; lastErr = null;
  if (!run) { setOut('<span class="ok">✔ ビルド成功</span>'); return 'ビルド成功'; }
  return await doRun(true);
}
async function doRun(afterBuild) {
  if (!built && !afterBuild) { const r = await doBuild(true); return r; }
  const r = execute();
  if (!r.ok) { lastErr = r.err; setOut(`<span class="ok">✔ ビルド成功</span>\n<span class="er">✖ 実行時エラー</span>\n${esc(r.err)}`); return '実行時エラー。' + r.err; }
  const o = r.out.trimEnd();
  setOut(`<span class="ok">✔ ビルド成功</span>\n<span class="mu">$ ./a.out</span>\n${esc(o) || '(出力なし)'}\n<span class="mu">終了コード 0</span>`);
  return o ? `ビルド成功。実行結果は${o.replace(/\n/g, '、')}です` : 'ビルド成功。出力はありません';
}

async function handle(text) {
  if (busy) return; busy = true; hideClarify();
  try {
    showTr(text, true);
    setState('Interpreting'); await wait(450);
    const c = interpret(text);
    let fb;
    if (c.clarify) { setState('Speaking'); showClarify(c.clarify, c.opts); await speak(c.clarify); return; }
    if (c.op === 'unsupported') { setState('Speaking'); fb = 'このコマンドは試作では未対応です。本番ではAIが解釈します'; setOut(`<span class="er">未対応:</span> ${esc(text)}\n<span class="mu">コードは変更していません</span>`); await speak(fb); return; }
    setState('Applying'); await wait(250);
    if (c.op === 'build') fb = await doBuild(false);
    else if (c.op === 'build_and_run') fb = await doBuild(true);
    else if (c.op === 'run') fb = await doRun(false);
    else if (c.op === 'explain') fb = lastErr ? '最新のエラーは、' + lastErr.replace(/→.*/, '') : 'エラーはありません';
    else fb = apply(c);
    render();
    setState('Speaking'); if (c.op === 'explain') setOut(`<span class="er">${esc(lastErr || 'エラーなし')}</span>`);
    await speak(fb);
  } finally { busy = false; setState('Idle'); }
}

/* ---------- 音声認識（対応ブラウザのみ） ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
function startMic() {
  if (!SR) { alert('このブラウザは音声認識に未対応です。文字入力で試してください。'); $('inp').focus(); return; }
  if (busy) return;
  rec = new SR(); rec.lang = 'ja-JP'; rec.interimResults = true; rec.continuous = false;
  let finalText = '';
  rec.onstart = () => { listening = true; $('mic').classList.add('on'); setState('Listening'); showTr('', false); };
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript; }
    showTr(finalText + interim, false);
  };
  rec.onerror = e => { showTr('', false); $('trLab').textContent = '音声認識エラー: ' + e.error; };
  rec.onend = () => { listening = false; $('mic').classList.remove('on'); setState('Idle'); if (finalText.trim()) handle(finalText.trim()); };
  try { rec.start(); } catch {}
}
$('mic').onclick = () => { if (listening) rec?.stop(); else startMic(); };

/* ---------- UI配線 ---------- */
$('form').onsubmit = e => { e.preventDefault(); const v = $('inp').value.trim(); if (!v) return; $('inp').value = ''; handle(v); };
$('bUndo').onclick = () => handle('一つ戻して'); $('bRedo').onclick = () => handle('やり直して');
$('bBuild').onclick = () => handle('ビルドして'); $('bRun').onclick = () => handle('実行して');
document.querySelectorAll('.stab').forEach(b => b.onclick = () => showPane(b.dataset.p));

const CMDS = {
  'コード記述': ['イント サム ゼロ', 'イント カウント ゼロ', 'フロート スピード 3.5', 'ブール フラグ トゥルー', 'カウントを1増やして', 'カウントに10を足して', 'サムを表示して', 'ゼロを返して'],
  '制御構文': ['アイを1から10以下までループ', 'アイを0から10未満までループ', '10までループ', 'カウントが10以上なら', 'それ以外なら', 'フラグが真の間', 'ブロックを抜けて'],
  '編集・IDE': ['一つ戻して', 'やり直して', '直前の行を削除', 'ビルドして', 'ビルドして実行', 'エラーを説明して', '保存して', '今の行を読み上げて']
};
$('cmdList').innerHTML = Object.entries(CMDS).map(([g, a]) => `<div class="grp">${g}</div><div class="chips">${a.map(x => `<button class="chip">${x}</button>`).join('')}</div>`).join('');
$('cmdList').onclick = e => { if (e.target.classList.contains('chip')) handle(e.target.textContent); };

$('demo').onclick = async () => {
  if (busy) return; undoStack = []; redoStack = []; lastJson = null;
  doc = { lines: INIT.slice(), cursor: 3, version: 0 }; render(); showPane('pOut');
  for (const s of ['イント サム ゼロ', 'アイを1から10以下までループ', 'サムにアイを足して', 'ブロックを抜けて', 'サムを表示して', 'ゼロを返して', 'ビルドして実行']) {
    while (busy) await wait(100); await handle(s); await wait(400);
  }
};
render();
</script>
</body>
